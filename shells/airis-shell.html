<title>AIRIS Shell</title>
<style>
  /* DS_TOKENS_INJECT */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Attribute-based state toggling: author `display` (e.g. .empty-state{display:flex}) would otherwise
     beat the UA `[hidden]{display:none}` rule and leave hidden blocks visible. !important immunizes it. */
  [hidden] { display: none !important; }
  body { font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; background: rgba(244,246,249,1); color: rgba(0,10,58,1); -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(217,218,225,1); border-radius: 3px; }

  .shell { display: flex; flex-direction: column; height: 100vh; }

  /* TopBar */
  .topbar {
    height: 48px; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(42,47,105,1), rgba(49,63,129,1), rgba(42,47,105,1));
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; box-shadow: 0 1px 8px rgba(0,10,58,0.08); z-index: 200;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .topbar-logo { display: flex; align-items: center; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .topbar-right .divider { width: 1px; align-self: stretch; margin: 4px 0; background: rgba(217,218,225,0.25); }
  .topbar-dropdown {
    display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px;
    border-radius: 8px; cursor: pointer; transition: background 0.15s;
  }
  .topbar-dropdown:hover { background: rgba(255,255,255,0.07); }
  .topbar-dropdown .dropdown-icon { display: flex; flex-shrink: 0; color: #fff; }
  .topbar-dropdown .dropdown-label {
    font-size: 14px; font-weight: 400; letter-spacing: 0.2px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 120px; min-width: 48px;
  }
  .topbar-dropdown .dropdown-arrow { display: flex; flex-shrink: 0; color: #fff; }
  .topbar-dropdown-wrap { position: relative; }
  .topbar-icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; transition: background 0.15s;
  }
  .topbar-icon-btn:hover { background: rgba(255,255,255,0.1); }
  .topbar-dropdown .avatar {
    width: 24px; height: 24px; border-radius: 9999px; background: rgba(193,214,255,1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .topbar-dropdown .avatar span { font-size: 12px; font-weight: 600; color: rgba(51,59,97,1); letter-spacing: 0.2px; line-height: 16px; }

  /* Project dropdown menu */
  .project-menu {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    width: 280px; max-height: 640px; overflow-y: auto;
    background: #fff; border: 1px solid rgba(217,218,225,1); border-radius: 8px;
    box-shadow: 0 2px 16px rgba(0,10,58,0.16); z-index: 200;
    flex-direction: column;
  }
  .project-menu.open { display: flex; }
  .project-menu-header {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; background: rgba(242,243,245,1);
    border-bottom: 1px solid rgba(217,218,225,1); border-radius: 8px 8px 0 0;
  }
  .project-menu-header-inner {
    display: flex; align-items: flex-start; gap: 8px; flex: 1; padding: 0 8px; overflow: hidden;
  }
  .project-menu-header-avatar {
    width: 36px; height: 36px; border-radius: 99px; flex-shrink: 0;
    background: rgba(237,238,241,1); border: 1px solid rgba(153,157,176,1);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .project-menu-header-name {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.2px;
    color: rgba(0,10,58,1); line-height: 24px; padding-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .project-menu-body { padding: 4px 0; }
  .project-group { display: flex; flex-direction: column; }
  .project-group-name {
    display: flex; align-items: flex-start; gap: 8px; padding: 8px 16px 0;
  }
  .project-avatar {
    width: 20px; height: 20px; border-radius: 2px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .project-avatar span { font-size: 12px; font-weight: 600; color: rgba(51,59,97,1); letter-spacing: 0.2px; line-height: 16px; }
  .project-group-label {
    font-size: 12px; font-weight: 400; letter-spacing: 0.2px; color: rgba(0,10,58,0.7);
    line-height: 16px; padding: 2px 0; white-space: nowrap;
  }
  .project-menu-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 44px;
    cursor: pointer; transition: background 0.1s;
  }
  .project-menu-item:hover { background: rgba(0,10,58,0.05); }
  .project-menu-item.current { background: rgba(41,106,255,0.07); }
  .project-menu-item-logo {
    width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .project-menu-item-label {
    font-size: 14px; font-weight: 400; letter-spacing: 0.2px; color: rgba(0,10,58,1);
    line-height: 20px; white-space: nowrap;
  }
  .project-menu-item.current .project-menu-item-label { font-weight: 600; color: rgba(41,106,255,1); }
  .project-menu-footer {
    border-top: 1px solid rgba(217,217,217,1); padding: 4px 0;
    border-radius: 0 0 8px 8px;
  }
  .project-menu-footer-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    cursor: pointer; transition: background 0.1s;
  }
  .project-menu-footer-item:hover { background: rgba(0,10,58,0.05); }
  .project-menu-footer-item .footer-icon { display: flex; flex-shrink: 0; color: rgba(0,10,58,0.7); }
  .project-menu-footer-item .footer-label {
    font-size: 14px; font-weight: 400; letter-spacing: 0.2px; color: rgba(0,10,58,1); line-height: 20px;
  }

  /* User dropdown menu */
  .user-dropdown-wrapper { position: relative; }
  .user-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    background: #fff; border: 1px solid #dedfe5; border-radius: 8px;
    min-width: 200px; z-index: 200; box-shadow: 0 4px 16px rgba(0,10,58,0.1);
  }
  .user-dropdown-menu.open { display: block; }
  .user-dropdown-menu-content { padding: 8px 0; }
  .user-menu-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    cursor: pointer; transition: background 0.1s;
  }
  .user-menu-item:hover { background: rgba(0,10,58,0.05); }
  .user-menu-item .menu-icon { display: flex; flex-shrink: 0; color: rgba(0,10,58,0.57); width: 20px; height: 20px; }
  .user-menu-item .menu-label {
    flex: 1; font-size: 14px; font-weight: 400; letter-spacing: 0.2px;
    color: rgba(0,10,58,1); line-height: 20px; white-space: nowrap;
  }
  .user-menu-divider { padding: 8px 12px; }
  .user-menu-divider::after { content: ''; display: block; height: 1px; background: #dedfe5; }
  .user-menu-item-toggle {
    display: flex; align-items: center; gap: 8px; height: 36px;
    padding: 8px 8px 8px 16px; cursor: pointer; transition: background 0.1s;
  }
  .user-menu-item-toggle:hover { background: rgba(0,10,58,0.05); }
  .user-menu-item-toggle .menu-icon { display: flex; flex-shrink: 0; color: rgba(0,10,58,0.57); width: 20px; height: 20px; }
  .user-menu-item-toggle .menu-label {
    flex: 1; font-size: 14px; font-weight: 400; letter-spacing: 0.2px;
    color: rgba(0,10,58,1); line-height: 20px; white-space: nowrap;
  }
  .toggle-switch {
    width: 40px; height: 20px; position: relative; flex-shrink: 0; cursor: pointer;
  }
  .toggle-switch .toggle-bg {
    position: absolute; inset: 5%; border-radius: 10px; background: #296aff; transition: background 0.2s;
  }
  .toggle-switch .toggle-knob {
    position: absolute; top: 15%; right: 10%; bottom: 15%; width: 14px;
    border-radius: 9px; background: #fff; transition: left 0.2s, right 0.2s;
  }
  .toggle-switch.off .toggle-bg { background: rgba(0,10,58,0.2); }
  .toggle-switch.off .toggle-knob { right: auto; left: 10%; }
  .user-menu-item-expand .expand-arrow { display: flex; flex-shrink: 0; color: rgba(0,10,58,0.57); }

  /* Body layout */
  .body-row { display: flex; flex: 1; overflow: hidden; }

  /* Icon rail */
  .icon-rail {
    width: 56px; flex-shrink: 0; background: rgba(255,255,255,1);
    border-right: 1px solid rgba(217,218,225,1);
    display: flex; flex-direction: column; align-items: center;
    z-index: 110;
  }
  .rail-item {
    width: 56px; height: 56px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,10,58,0.8); transition: color 0.15s;
    position: relative;
  }
  .rail-item::before {
    content: ''; position: absolute; width: 36px; height: 36px;
    border-radius: 8px; transition: background 0.15s;
  }
  .rail-item svg { position: relative; z-index: 1; }
  .rail-item:hover::before { background: rgba(0,10,58,0.05); }
  .rail-item.active::before { background: rgba(41,106,255,1); }
  .rail-item.active { color: #fff; }
  .rail-spacer { flex: 1; }

  /* Secondary nav */
  .secondary-nav {
    width: 220px; flex-shrink: 0; background: rgba(255,255,255,1);
    border-right: 1px solid rgba(217,218,225,1);
    display: flex; flex-direction: column;
    overflow: hidden; transition: width 0.2s ease;
  }
  .secondary-nav.collapsed { width: 0; border-right: none; }
  .secondary-nav-header {
    display: flex; align-items: center; height: 48px;
    padding: 14px 8px 14px 16px; flex-shrink: 0;
  }
  .secondary-nav-header .section-title {
    flex: 1; font-size: 14px; font-weight: 600;
    letter-spacing: 0.2px; color: rgba(0,10,58,1);
  }
  .nav-search-btn {
    width: 32px; height: 32px; border-radius: 4px; border: none; background: none;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,10,58,0.57); cursor: pointer; transition: background 0.15s;
  }
  .nav-search-btn:hover { background: rgba(0,10,58,0.05); }
  .nav-items-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .nav-btn-wrap { padding: 0 12px; flex-shrink: 0; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 6px 12px 6px 8px;
    background: #296AFF; color: #fff; border: none; border-radius: 4px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.2px;
    cursor: pointer; transition: background 0.15s;
  }
  .nav-btn:hover { background: #1A5AEF; }
  .nav-btn svg { flex-shrink: 0; }
  .nav-items { display: flex; flex-direction: column; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 12px;
    cursor: pointer; transition: background 0.1s; min-height: 48px;
  }
  .nav-item:hover { background: rgba(0,10,58,0.05); }
  .nav-item.active { background: rgba(41,106,255,0.07); }
  .nav-item .icon { display: flex; flex-shrink: 0; width: 24px; height: 24px; }
  .nav-item .label { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; color: rgba(0,10,58,1); white-space: nowrap; }
  .nav-item.active .label { color: rgba(41,106,255,1); }
  .nav-section-header {
    padding: 24px 12px 4px; font-size: 14px; font-weight: 600;
    color: rgba(0,10,58,0.7); letter-spacing: 0.2px;
  }

  /* Main content */
  .main-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .page-header {
    flex-shrink: 0; background: #fff;
    border-bottom: 1px solid #DEDFE5;
    display: flex; align-items: center;
    padding: 12px 24px;
  }
  .breadcrumb-label { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; color: #000A3A; white-space: nowrap; }
  .content-area { flex: 1; overflow: auto; background: #EDEEF1; padding: 24px; }
  .content-placeholder {
    background: #fff; border: 1px solid #D9DAE1; border-radius: 16px;
    padding: 48px; text-align: center; color: rgba(0,10,58,0.35);
    font-size: 14px;
  }
</style>

  var collapsed = false;
  var activeKey = 'analyze';

  var rail = document.getElementById('iconRail');
  var secNav = document.getElementById('secondaryNav');
  var hamburger = document.getElementById('hamburger');
  var btnWrap = document.getElementById('navBtnWrap');

  function updateActiveState() {
    rail.querySelectorAll('.rail-item[data-key]').forEach(function(el) {
      el.classList.toggle('active', el.dataset.key === activeKey);
    });

    var data = navData[activeKey];
    if (data && !collapsed && data.items.length > 0) {
      secNav.classList.remove('collapsed');
      document.getElementById('sectionTitle').textContent = data.title;

      if (data.hasBtn) {
        btnWrap.style.display = '';
      } else {
        btnWrap.style.display = 'none';
      }

      var navItems = document.getElementById('navItems');
      navItems.innerHTML = data.items.map(function(item) {
        if (item.type === 'header') {
          return '<div class="nav-section-header">' + item.label + '</div>';
        }
        return '<div class="nav-item' + (item.active ? ' active' : '') + '" data-sub="' + item.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '">' +
          (item.icon ? '<span class="icon">' + item.icon + '</span>' : '') +
          '<span class="label">' + item.label + '</span>' +
        '</div>';
      }).join('');

      navItems.querySelectorAll('.nav-item').forEach(function(el) {
        el.addEventListener('click', function() {
          navItems.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
          el.classList.add('active');
          var crumb = document.getElementById('breadcrumb');
          if (crumb) crumb.textContent = el.querySelector('.label').textContent;
        });
      });

      var activeNav = navItems.querySelector('.nav-item.active');
      if (activeNav) {
        var crumb = document.getElementById('breadcrumb');
        if (crumb) crumb.textContent = activeNav.querySelector('.label').textContent;
      }
    } else if (data && data.items.length === 0) {
      secNav.classList.add('collapsed');
      var crumb = document.getElementById('breadcrumb');
      if (crumb) crumb.textContent = data.title;
    } else {
      secNav.classList.add('collapsed');
    }
  }

  hamburger.addEventListener('click', function() {
    collapsed = !collapsed;
    if (collapsed) {
      secNav.classList.add('collapsed');
    } else {
      updateActiveState();
    }
  });

  rail.querySelectorAll('.rail-item[data-key]').forEach(function(el) {
    el.addEventListener('click', function() {
      activeKey = el.dataset.key;
      collapsed = false;
      updateActiveState();
    });
  });

  updateActiveState();

  // Project dropdown (topbar)
  var projectBtn = document.getElementById('projectDropdownBtn');
  var projectMenu = document.getElementById('projectMenu');

  projectBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    projectMenu.classList.toggle('open');
    userDropdownMenu.classList.remove('open');
  });

  // User dropdown
  var userDropdownBtn = document.getElementById('userDropdownBtn');
  var userDropdownMenu = document.getElementById('userDropdownMenu');

  userDropdownBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    userDropdownMenu.classList.toggle('open');
    projectMenu.classList.remove('open');
  });

  document.addEventListener('click', function(e) {
    if (!projectMenu.contains(e.target)) {
      projectMenu.classList.remove('open');
    }
    if (!userDropdownMenu.contains(e.target) && !userDropdownBtn.contains(e.target)) {
      userDropdownMenu.classList.remove('open');
    }
  });

  // Light mode toggle
  var lightModeToggle = document.getElementById('lightModeToggle');
  lightModeToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    lightModeToggle.classList.toggle('off');
  });
})();
